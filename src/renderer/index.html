<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src http://127.0.0.1:* https://*.ankama.com https://*.ankama-games.com" />
    <link rel="stylesheet" href="style.css" />
    <title>Touch in STAKK</title>
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Touch in <b>STAKK</b></span>
      </div>
      <div class="win-controls">
        <button id="min" class="win-btn" title="Réduire" aria-label="Réduire">
          <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="5.5" width="8" height="1" rx="0.5" fill="currentColor"/></svg>
        </button>
        <button id="max" class="win-btn" title="Agrandir" aria-label="Agrandir">
          <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button id="close" class="win-btn win-close" title="Fermer" aria-label="Fermer">
          <svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3 L9 9 M9 3 L3 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div id="patch-warn" hidden>
      <span class="warn-dot"></span>
      <span>Patchs de compatibilité indisponibles — le jeu risque de ne pas démarrer.</span>
      <button id="retry" class="btn-warn">Réessayer</button>
    </div>

    <nav id="tabbar">
      <div id="tabs"></div>
      <button id="add-tab" class="bar-btn" title="Ajouter un compte" aria-label="Ajouter un compte">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 3.5 V12.5 M3.5 8 H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button id="group-auto" class="bar-btn bar-btn-end" title="Grouper les comptes" aria-label="Grouper les comptes">
        <svg viewBox="0 0 18 16" width="16" height="15"><circle cx="6" cy="5" r="2.4" fill="currentColor"/><circle cx="12.5" cy="6" r="1.9" fill="currentColor" opacity=".7"/><path fill="currentColor" d="M2 13c0-2.2 1.8-3.6 4-3.6s4 1.4 4 3.6z"/><path fill="currentColor" opacity=".7" d="M10.4 13c.1-1.3.7-2.4 1.7-3 .1 0 .3-.1.4-.1 1.8 0 3.3 1.2 3.3 3z"/></svg>
      </button>
      <button id="follow-toggle" class="bar-btn" title="Suivre le meneur (groupe)" aria-label="Suivre le meneur">
        <svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M5.5 2.2a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8Zm.2 3.6c-.7 0-1.2.5-1.4 1.1L3 11.4l1.3.4.9-2.6.5 2.3-1.1 2.9 1.4.5 1.2-3.1c.1-.4 0-.7-.2-1l-.6-.8.9-.3c.3.5.8.8 1.4.9l1.7.2.2-1.3-1.6-.2a.9.9 0 0 1-.6-.4l-.5-.7c-.3-.4-.7-.6-1.2-.6Z"/><circle cx="11.5" cy="3.3" r="1.2" fill="currentColor" opacity=".65"/></svg>
      </button>
      <button id="open-settings" class="bar-btn" title="Réglages" aria-label="Réglages">
        <svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M8 5.4a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2Zm0 1.4a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/><path fill="currentColor" d="M7.1 1.2 6.9 2.7a5.3 5.3 0 0 0-1 .4L4.7 2.2 3 3.9l.9 1.2a5.3 5.3 0 0 0-.4 1l-1.5.2v2.4l1.5.2c.1.35.24.68.4 1L3 12.1 4.7 13.8l1.2-.9c.32.16.65.3 1 .4l.2 1.5h2.4l.2-1.5c.35-.1.68-.24 1-.4l1.2.9L13.8 12.1l-.9-1.2c.16-.32.3-.65.4-1l1.5-.2V7.3l-1.5-.2a5.3 5.3 0 0 0-.4-1l.9-1.2L12.1 3.2l-1.2.9a5.3 5.3 0 0 0-1-.4l-.2-1.5Z" opacity=".85"/></svg>
      </button>
    </nav>

    <main id="views"></main>

    <div id="empty" hidden>
      <div class="empty-mark"></div>
      <h2>Aucun compte</h2>
      <p>Ajoute un compte Dofus Touch pour commencer à jouer.</p>
      <button id="add-first" class="btn-primary">Ajouter un compte</button>
    </div>

    <div id="settings-modal" hidden>
      <div class="modal-card">
        <h2>Réglages</h2>
        <div class="field">
          <span class="field-label">Résolution de la fenêtre</span>
          <div class="res-inputs">
            <input id="res-w" type="number" min="960" aria-label="Largeur" />
            <span class="res-x">×</span>
            <input id="res-h" type="number" min="600" aria-label="Hauteur" />
          </div>
        </div>
        <label class="field toggle-field" for="muted">
          <span class="field-label">Couper le son</span>
          <input id="muted" type="checkbox" class="switch" />
        </label>
        <label class="field toggle-field" for="switch-on-turn">
          <span class="field-label">Basculer sur l'onglet au tour de combat</span>
          <input id="switch-on-turn" type="checkbox" class="switch" />
        </label>
        <label class="field toggle-field" for="notifications">
          <span class="field-label">Notifications (tour, message privé, déconnexion)</span>
          <input id="notifications" type="checkbox" class="switch" />
        </label>
        <div class="modal-actions">
          <button id="close-settings" class="btn-ghost">Annuler</button>
          <button id="save-settings" class="btn-primary">Enregistrer</button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
